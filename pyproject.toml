[project]
name = "serene-mind"
version = "0.1.0"
description = "A calm, minimalistic mental wellness companion with real-time facial mood detection, daily multimedia journaling, midnight reset, 8 PM reminders, and wellness analytics."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
]
